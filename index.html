<style>

  html, body { margin: 0; padding: 0; font-family: 'Manrope', sans-serif; color: var(--slate-700); background: var(--neutral-50); }
  #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  #gate .card { background: #fff; border-radius: 12px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(6,33,51,0.08); border-top: 4px solid var(--pink); }

  #gate p { font-size: 14px; color: var(--slate-700); margin: 0 0 24px 0; }
  #gate input[type=password] { width: 100%; padding: 12px 14px; font-family: 'Manrope', sans-serif; font-size: 15px; border: 1px solid var(--neutral-300); border-radius: 8px; margin-bottom: 12px; outline: none; }
  #gate input[type=password]:focus { border-color: var(--navy); }
  #gate button { width: 100%; padding: 12px 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; background: var(--navy); color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  #gate button:hover { background: #0b2e47; }
  #gate .err { color: #ee0626; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #content { display: none; padding: 0; background: #fff; max-width: 900px; margin: 24px auto; box-shadow: 0 4px 24px rgba(6,33,51,0.06); }
  .loading { display: none; text-align: center; color: var(--slate-700); padding: 20px; font-family: 'Inter', sans-serif; }
</style>

  function b64toU8(b64) {
    const s = atob(b64);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }

  async function unlock(pw) {
    const salt = b64toU8(SALT);
    const iv   = b64toU8(IV);
    const ct   = b64toU8(CT);
    const keyMaterial = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw),
      { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false, ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    return new TextDecoder().decode(plain);
  }

  document.getElementById("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const err = document.getElementById("err");
    const loading = document.getElementById("loading");
    err.textContent = "";
    loading.style.display = "block";
    try {
      const html = await unlock(pw);
      document.getElementById("gate").style.display = "none";
      const content = document.getElementById("content");
      content.innerHTML = html;
      content.style.display = "block";
      document.title = "Alliance Foods - Jem Pricing Letter";
    } catch (ex) {
      loading.style.display = "none";
      err.textContent = "Incorrect password.";
    }
  });
</script>
